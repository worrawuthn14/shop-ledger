<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกบัญชีร้านค้า (Shop Ledger)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom Animations for Modals */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes slideUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        .modal-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .modal-slide {
            animation: slideUp 0.3s ease-out forwards;
        }

        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="text-gray-800 pb-24">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative overflow-hidden">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-teal-500 to-emerald-500 text-white p-6 rounded-b-[2.5rem] shadow-md">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-2xl font-bold">บัญชีร้านค้าของฉัน</h1>
                    <p class="text-teal-100 text-sm" id="currentDate">--/--/----</p>
                </div>
                <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>
            
            <!-- Net Profit Highlight -->
            <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-md border border-white/20 mt-2">
                <p class="text-teal-100 text-sm mb-1">กำไรสุทธิทั้งหมด</p>
                <h2 class="text-3xl font-bold tracking-tight text-white">฿ <span id="displayNetProfit">0</span></h2>
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-5 space-y-6">
            
            <!-- Stats Grid -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Sales -->
                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-2 text-blue-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                        <span class="text-sm font-semibold">ยอดขาย</span>
                    </div>
                    <p class="text-xl font-bold text-gray-800">฿ <span id="displaySales">0</span></p>
                </div>
                
                <!-- Costs -->
                <div class="bg-red-50 p-4 rounded-2xl border border-red-100 shadow-sm">
                    <div class="flex items-center gap-2 mb-2 text-red-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path></svg>
                        <span class="text-sm font-semibold">ต้นทุน</span>
                    </div>
                    <p class="text-xl font-bold text-gray-800">฿ <span id="displayCosts">0</span></p>
                </div>
                
                <!-- Withdrawals (Full width) -->
                <div class="col-span-2 bg-orange-50 p-4 rounded-2xl border border-orange-100 shadow-sm flex justify-between items-center">
                    <div>
                        <div class="flex items-center gap-2 mb-1 text-orange-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            <span class="text-sm font-semibold">เบิกเงินซื้อของเพิ่ม</span>
                        </div>
                        <p class="text-xs text-gray-500">เงินที่ดึงไปหมุนเวียน</p>
                    </div>
                    <p class="text-xl font-bold text-gray-800">฿ <span id="displayWithdrawals">0</span></p>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="bg-white p-4 rounded-2xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border border-gray-100">
                <h3 class="text-md font-semibold text-gray-700 mb-4">สัดส่วนรายรับ-รายจ่าย</h3>
                <div class="relative h-48 w-full flex justify-center items-center">
                    <canvas id="financeChart"></canvas>
                    <div id="noDataMsg" class="absolute text-gray-400 text-sm hidden">ยังไม่มีข้อมูล</div>
                </div>
            </div>

            <!-- History Section -->
            <div>
                <div class="flex justify-between items-end mb-4">
                    <h3 class="text-md font-semibold text-gray-700">รายการล่าสุด</h3>
                    <button onclick="clearAllData()" class="text-xs text-red-400 hover:text-red-600">ล้างข้อมูล</button>
                </div>
                <div id="historyList" class="space-y-3">
                    <!-- Transactions will be injected here -->
                </div>
            </div>
            
        </main>

        <!-- Floating Add Button -->
        <button onclick="openFormModal()" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-teal-500 hover:bg-teal-600 text-white rounded-full p-4 shadow-[0_8px_20px_-4px_rgba(20,184,166,0.6)] flex items-center gap-2 transition-transform active:scale-95 z-40">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span class="font-semibold px-1">บันทึกรายการ</span>
        </button>

        <!-- Form Modal Overlay -->
        <div id="formModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-50 hidden flex flex-col justify-end max-w-md mx-auto">
            <div class="bg-white rounded-t-3xl p-6 w-full shadow-2xl modal-slide relative">
                <!-- Close Button -->
                <button onclick="closeFormModal()" class="absolute top-4 right-4 bg-gray-100 text-gray-500 rounded-full p-2 hover:bg-gray-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>

                <h3 class="text-xl font-bold text-gray-800 mb-5">บันทึกรายการใหม่</h3>
                
                <form id="transactionForm" class="space-y-4">
                    <!-- Type Selection -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">ประเภทรายการ</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="cursor-pointer">
                                <input type="radio" name="type" value="sale" class="peer sr-only" checked>
                                <div class="text-center p-2 rounded-xl border border-gray-200 peer-checked:bg-blue-50 peer-checked:border-blue-400 peer-checked:text-blue-600 text-sm font-medium transition-all">
                                    ขายสินค้า
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="type" value="cost" class="peer sr-only">
                                <div class="text-center p-2 rounded-xl border border-gray-200 peer-checked:bg-red-50 peer-checked:border-red-400 peer-checked:text-red-600 text-sm font-medium transition-all">
                                    ต้นทุน
                                </div>
                            </label>
                            <label class="cursor-pointer">
                                <input type="radio" name="type" value="withdraw" class="peer sr-only">
                                <div class="text-center p-2 rounded-xl border border-gray-200 peer-checked:bg-orange-50 peer-checked:border-orange-400 peer-checked:text-orange-600 text-sm font-medium transition-all">
                                    เบิกเงิน
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Amount -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนเงิน (บาท)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500 font-semibold">฿</span>
                            <input type="number" id="amount" required min="1" step="0.01" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all text-lg font-semibold" placeholder="0.00">
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">รายละเอียด (ตัวเลือก)</label>
                        <input type="text" id="description" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all" placeholder="เช่น ขายเสื้อยืด, ค่าส่งของ">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3.5 rounded-xl shadow-md transition-transform active:scale-95 mt-4">
                        บันทึกข้อมูล
                    </button>
                </form>
            </div>
        </div>

        <!-- Success Popup Modal -->
        <div id="successModal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-[60] hidden flex items-center justify-center max-w-md mx-auto px-4">
            <div class="bg-white rounded-3xl p-8 w-full max-w-sm text-center shadow-2xl modal-pop">
                <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-5">
                    <svg class="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h3 class="text-2xl font-bold text-gray-800 mb-2">บันทึกสำเร็จ!</h3>
                <p class="text-gray-500 mb-6">ข้อมูลของคุณถูกอัปเดตเรียบร้อยแล้ว</p>
                <button onclick="closeSuccessModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 rounded-xl transition-colors">
                    ตกลง
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- State Management ---
        // Initialize data array from localStorage or empty array if null
        let transactions = JSON.parse(localStorage.getItem('shopTransactions')) || [];
        let myChart = null;

        // --- Helper Functions ---
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(amount);
        };

        const formatDate = (dateString) => {
            const date = new Date(dateString);
            return date.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };

        const setTodayDate = () => {
            const today = new Date();
            document.getElementById('currentDate').innerText = today.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' });
        };

        // --- Core Logic ---
        function calculateStats() {
            let sales = 0, costs = 0, withdrawals = 0;

            transactions.forEach(t => {
                if (t.type === 'sale') sales += t.amount;
                if (t.type === 'cost') costs += t.amount;
                if (t.type === 'withdraw') withdrawals += t.amount;
            });

            const netProfit = sales - costs;

            // Update DOM Elements
            document.getElementById('displaySales').innerText = formatMoney(sales);
            document.getElementById('displayCosts').innerText = formatMoney(costs);
            document.getElementById('displayWithdrawals').innerText = formatMoney(withdrawals);
            document.getElementById('displayNetProfit').innerText = formatMoney(netProfit);

            return { sales, costs, withdrawals };
        }

        function renderHistory() {
            const listContainer = document.getElementById('historyList');
            listContainer.innerHTML = '';

            if (transactions.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-gray-400 py-6 text-sm bg-white rounded-xl border border-gray-100">ยังไม่มีรายการบันทึก</div>';
                return;
            }

            // Sort by date descending (newest first)
            const sortedTransactions = [...transactions].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedTransactions.forEach(t => {
                // Determine styling based on type
                let iconStr, colorClass, bgColorClass, sign, typeName;
                
                if (t.type === 'sale') {
                    iconStr = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>';
                    colorClass = 'text-blue-600';
                    bgColorClass = 'bg-blue-100';
                    sign = '+';
                    typeName = 'ขายสินค้า';
                } else if (t.type === 'cost') {
                    iconStr = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>';
                    colorClass = 'text-red-600';
                    bgColorClass = 'bg-red-100';
                    sign = '-';
                    typeName = 'ต้นทุน';
                } else {
                    iconStr = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>';
                    colorClass = 'text-orange-600';
                    bgColorClass = 'bg-orange-100';
                    sign = '-';
                    typeName = 'เบิกเงิน';
                }

                const descText = t.description ? t.description : typeName;

                const itemHtml = `
                    <div class="flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm border border-gray-100">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center ${bgColorClass} ${colorClass}">
                                ${iconStr}
                            </div>
                            <div>
                                <p class="text-sm font-semibold text-gray-800">${descText}</p>
                                <p class="text-xs text-gray-400">${formatDate(t.date)}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold ${colorClass}">${sign} ฿${formatMoney(t.amount)}</p>
                            <button onclick="deleteTransaction(${t.id})" class="text-xs text-gray-300 hover:text-red-500 mt-1">ลบ</button>
                        </div>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', itemHtml);
            });
        }

        function renderChart(stats) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            const noDataMsg = document.getElementById('noDataMsg');
            
            // Destroy existing chart to prevent glitches when updating
            if (myChart) {
                myChart.destroy();
            }

            if (stats.sales === 0 && stats.costs === 0) {
                noDataMsg.classList.remove('hidden');
                document.getElementById('financeChart').style.display = 'none';
                return;
            } else {
                noDataMsg.classList.add('hidden');
                document.getElementById('financeChart').style.display = 'block';
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['ยอดขาย', 'ต้นทุน'],
                    datasets: [{
                        data: [stats.sales, stats.costs],
                        backgroundColor: [
                            '#3b82f6', // blue-500
                            '#ef4444', // red-500
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                usePointStyle: true,
                                padding: 20,
                                font: {
                                    family: "'Prompt', sans-serif",
                                    size: 12
                                }
                            }
                        }
                    }
                }
            });
        }

        // --- Form & Data Handling ---
        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const type = document.querySelector('input[name="type"]:checked').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const description = document.getElementById('description').value.trim();
            
            if (isNaN(amount) || amount <= 0) return;

            const newTransaction = {
                id: Date.now(),
                type: type,
                amount: amount,
                description: description,
                date: new Date().toISOString()
            };

            // Save to array and local storage
            transactions.push(newTransaction);
            localStorage.setItem('shopTransactions', JSON.stringify(transactions));

            // Reset form
            this.reset();
            
            // Close form modal, update UI, show success modal
            closeFormModal();
            updateUI();
            showSuccessModal();
        });

        function deleteTransaction(id) {
            if(confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
                transactions = transactions.filter(t => t.id !== id);
                localStorage.setItem('shopTransactions', JSON.stringify(transactions));
                updateUI();
            }
        }

        function clearAllData() {
            if(confirm('อันตราย! คุณแน่ใจหรือไม่ที่จะลบข้อมูลทั้งหมด? การกระทำนี้ไม่สามารถย้อนกลับได้')) {
                transactions = [];
                localStorage.removeItem('shopTransactions');
                updateUI();
            }
        }

        function updateUI() {
            const stats = calculateStats();
            renderHistory();
            renderChart(stats);
        }

        // --- Modal Controls ---
        const formModal = document.getElementById('formModal');
        const successModal = document.getElementById('successModal');

        function openFormModal() {
            formModal.classList.remove('hidden');
        }

        function closeFormModal() {
            formModal.classList.add('hidden');
        }

        function showSuccessModal() {
            successModal.classList.remove('hidden');
        }

        function closeSuccessModal() {
            successModal.classList.add('hidden');
        }

        // Close form modal if clicking outside the white box
        formModal.addEventListener('click', (e) => {
            if (e.target === formModal) closeFormModal();
        });

        // --- Initialization ---
        window.onload = () => {
            setTodayDate();
            updateUI();
        };

    </script>
</body>
</html>
